<svg width="500" height="500" viewBox="0 0 500 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Vibrant Blue Gradient for P shape -->
    <linearGradient id="mark-white-p-gradient" x1="240" y1="120" x2="380" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="35%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <!-- Center Point Sphere Gradient -->
    <radialGradient id="mark-white-iris-gradient" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(254 240) rotate(45) scale(38)">
      <stop offset="0%" stop-color="#93C5FD" />
      <stop offset="40%" stop-color="#38BDF8" />
      <stop offset="80%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </radialGradient>
  </defs>

  <!-- Left 'D' in Crisp Pure White for High Visibility on Dark Backgrounds -->
  <path
    d="M 120 100 
       L 255 100 
       C 335 100, 375 160, 375 250 
       C 375 340, 335 400, 255 400 
       L 120 400 
       Z
       M 175 160 
       L 175 340 
       L 245 340 
       C 285 340, 310 305, 310 250 
       C 310 195, 285 160, 245 160 
       Z"
    fill="#FFFFFF"
  />

  <!-- Right 'P' Loop with Pointer Tail -->
  <path
    d="M 252 118
       C 315 118, 385 145, 385 228
       C 385 298, 335 332, 275 332
       L 256 396
       L 256 312
       C 256 312, 252 200, 252 118
       Z"
    fill="url(#mark-white-p-gradient)"
  />

  <!-- Outer White Target Ring with Precision Border -->
  <circle
    cx="260"
    cy="246"
    r="58"
    fill="#FFFFFF"
    stroke="#070B14"
    stroke-width="5"
  />

  <!-- Inner Center Point Blue Sphere -->
  <circle
    cx="260"
    cy="246"
    r="34"
    fill="url(#mark-white-iris-gradient)"
  />

  <!-- Specular Reflection Highlight on Sphere -->
  <circle
    cx="249"
    cy="235"
    r="8"
    fill="#FFFFFF"
    opacity="0.9"
  />

  <!-- Angled Code Brackets </> inside the P Loop -->
  <g transform="translate(328, 172) rotate(38)" stroke="#FFFFFF" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left bracket < -->
    <path d="M -12 -9 L -18 0 L -12 9" />
    <!-- Center slash / -->
    <path d="M 4 -12 L -4 12" />
    <!-- Right bracket > -->
    <path d="M 12 -9 L 18 0 L 12 9" />
  </g>
</svg>
