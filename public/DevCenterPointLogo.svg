<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="dcp-p-gradient" x1="250" y1="80" x2="420" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="45%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>

    <radialGradient id="dcp-center-dot" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(252 225) rotate(45) scale(55)">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="40%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1E40AF" />
    </radialGradient>

    <mask id="dcp-ring-cutout">
      <rect width="512" height="512" fill="white" />
      <circle cx="260" cy="226" r="74" fill="black" />
    </mask>
  </defs>

  <!-- Background container optional (transparent) -->

  <!-- Left 'D' in Dark Charcoal Navy -->
  <path
    d="M 74 84 
       L 230 84 
       C 310 84, 342 158, 342 226 
       C 342 296, 310 370, 230 370 
       L 74 370 
       Z
       M 130 140 
       L 130 314 
       L 216 314 
       C 262 314, 286 276, 286 226 
       C 286 176, 262 140, 216 140 
       Z"
    fill="#0B132B"
    mask="url(#dcp-ring-cutout)"
  />

  <!-- Right 'P' with pointer point -->
  <path
    d="M 260 102
       C 336 102, 418 126, 418 212
       C 418 290, 344 318, 278 318
       L 260 450
       L 260 318
       Z"
    fill="url(#dcp-p-gradient)"
    mask="url(#dcp-ring-cutout)"
  />

  <!-- Negative Space Halo Ring -->
  <circle cx="260" cy="226" r="70" fill="white" />

  <!-- Center Point Sphere -->
  <circle cx="260" cy="226" r="40" fill="url(#dcp-center-dot)" />

  <!-- Code Brackets </> -->
  <g stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 352 176 L 334 192 L 352 208" />
    <path d="M 370 170 L 358 214" />
    <path d="M 378 176 L 396 192 L 378 208" />
  </g>
</svg>
