<svg width="780" height="200" viewBox="0 0 780 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="lh-p-gradient" x1="120" y1="50" x2="190" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="60%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#1E40AF" />
    </linearGradient>

    <radialGradient id="lh-iris-gradient" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(133 100) rotate(45) scale(20)">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="45%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </radialGradient>
  </defs>

  <!-- === EMBLEM ON LEFT === -->
  <g id="logo-emblem">
    <!-- D in White -->
    <path
      d="M 50 30 
         L 130 30 
         C 176 30, 200 66, 200 100 
         C 200 134, 176 170, 130 170 
         L 50 170 
         Z
         M 82 62 
         L 82 138 
         L 125 138 
         C 148 138, 162 122, 162 100 
         C 162 78, 148 62, 125 62 
         Z"
      fill="#FFFFFF"
    />

    <!-- P Loop with Pointer Tail -->
    <path
      d="M 128 38
         C 165 38, 205 52, 205 96
         C 205 132, 175 148, 142 148
         L 130 182
         L 130 138
         Z"
      fill="url(#lh-p-gradient)"
    />

    <!-- White Target Ring -->
    <circle
      cx="134"
      cy="100"
      r="32"
      fill="#FFFFFF"
      stroke="#050811"
      stroke-width="3"
    />

    <!-- Center Point Blue Sphere -->
    <circle
      cx="134"
      cy="100"
      r="19"
      fill="url(#lh-iris-gradient)"
    />

    <!-- Highlight Dot -->
    <circle
      cx="128"
      cy="94"
      r="4.5"
      fill="#93C5FD"
      opacity="0.9"
    />

    <!-- Code Brackets </> -->
    <g transform="translate(172, 68) rotate(38) scale(0.55)" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M -12 -9 L -18 0 L -12 9" />
      <path d="M 4 -12 L -4 12" />
      <path d="M 12 -9 L 18 0 L 12 9" />
    </g>
  </g>

  <!-- === TYPOGRAPHY ON RIGHT === -->
  <g id="brand-typography">
    <!-- DevCenterPoint -->
    <text x="235" y="105" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="900" letter-spacing="-1.5">
      <tspan fill="#3B82F6">DevCenter</tspan><tspan fill="#FFFFFF">Point</tspan>
    </text>

    <!-- Tagline -->
    <text x="240" y="152" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16.5" font-weight="700" fill="#E2E8F0" letter-spacing="6">
      CODE. BUILD. DEPLOY. SCALE.
    </text>
  </g>
</svg>
